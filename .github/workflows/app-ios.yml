# แอป iOS
# - ทุก push: build สำหรับ simulator (ตรวจว่าคอมไพล์ผ่าน ไม่ต้องใช้บัญชี Apple)
# - push tag "ios-*" (เช่น ios-1) หรือกด Run workflow: build + เซ็น + อัปโหลดขึ้น TestFlight
#   ต้องตั้ง Secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (เนื้อหาไฟล์ .p8 ทั้งไฟล์)
name: App · iOS
on:
  push:
    paths: ['app/**', '*.js', '*.css', '*.html', 'admin/**', 'assets/**', 'version.json', '.github/workflows/app-ios.yml']
    tags: ['ios-*']
  workflow_dispatch:
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      UPLOAD: ${{ startsWith(github.ref, 'refs/tags/ios-') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Web → Capacitor (+ pod install)
        working-directory: app
        run: npm ci && npm run web && npx cap sync ios
      - name: Simulator build (compile check)
        if: env.UPLOAD != 'true'
        working-directory: app/ios/App
        run: xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -30
      - name: Archive + upload to TestFlight
        if: env.UPLOAD == 'true'
        working-directory: app/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$TEAM" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ] || [ -z "$KEY_P8" ]; then echo "::error::ยังไม่ได้ตั้ง Secrets ของ Apple (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8)"; exit 1; fi
          KEY="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"; printf '%s' "$KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER")
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} "${AUTH[@]}" archive | tail -30
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" | tail -30
          rm -f "$KEY"
