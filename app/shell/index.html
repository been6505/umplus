<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>HelpMe4U ทีม</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><b>HelpMe4U</b><span>แอปทีมอาสา</span></header>
<main>
  <!-- ยังไม่ได้เชื่อมทีม -->
  <section class="card" id="link-card" hidden>
    <h1>เชื่อมกับทีมของคุณ</h1>
    <p>วางลิงก์ทีมที่ได้จากศูนย์ (ลิงก์หน้าทีม <code>…/team/?id=…</code>) ทำครั้งเดียว</p>
    <button class="btn primary" id="paste">📋 วางลิงก์จากคลิปบอร์ด</button>
    <input id="link-in" inputmode="url" autocomplete="off" placeholder="หรือพิมพ์/วางลิงก์ทีมที่นี่" aria-label="ลิงก์ทีม">
    <button class="btn" id="link-go">เชื่อมทีม</button>
    <p class="err" id="link-err" role="alert"></p>
  </section>

  <!-- เชื่อมแล้ว -->
  <section id="main-card" hidden>
    <div class="card">
      <div class="row"><div><small>รหัสทีม</small><b id="tk"></b></div><div class="st" id="st"><span></span><em>ปิดอยู่</em></div></div>
      <label class="switch"><span>ส่งตำแหน่งให้ศูนย์อัตโนมัติ<small>ส่งต่อแม้ล็อกจอหรือสลับแอป</small></span><input type="checkbox" id="trk" role="switch"><i></i></label>
      <div class="btns">
        <button class="btn" id="send-now">ส่งตำแหน่งตอนนี้</button>
        <button class="btn primary" id="open-team">เปิดหน้าทีม ↗</button>
      </div>
      <p class="hint" id="hint"></p>
    </div>
    <details class="card">
      <summary>สถานะการส่ง</summary>
      <ol class="log" id="log"></ol>
    </details>
    <details class="card">
      <summary>การตั้งค่า</summary>
      <label class="opt">ส่งเมื่อขยับเกิน
        <select id="dist"><option value="15">15 เมตร</option><option value="30" selected>30 เมตร</option><option value="60">60 เมตร</option><option value="120">120 เมตร</option></select>
      </label>
      <p class="hint">ศูนย์: <span id="srv"></span></p>
      <button class="btn danger" id="unlink">เลิกเชื่อมทีมนี้</button>
    </details>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
