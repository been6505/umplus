<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#102f42">
<title>จัดทีม · UM+ หลังบ้าน</title>
<link rel="icon" href="../../assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../admin.css?v=6">
<link rel="stylesheet" href="../pages.css?v=6">
</head>
<body>
<section id="login" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="off">
    <img src="../../assets/ummatee-logo.png" alt="UMMATEE" width="110" height="66">
    <h1>จัดทีม · UM+</h1>
    <p>สำหรับแอดมินและทีมอาสา ใส่รหัสทีมเพื่อเข้าใช้งาน</p>
    <label class="fld"><span>รหัสทีม</span><input id="login-key" type="password" required autocomplete="current-password"></label>
    <label class="chk"><input id="login-remember" type="checkbox" checked><span>จำรหัสไว้ในเครื่องนี้</span></label>
    <button class="btn primary" id="login-go" type="submit">เข้าสู่ระบบ</button>
    <p class="err" id="login-err" role="alert"></p>
    <a class="back" href="../../">← กลับหน้าเว็บหลัก</a>
  </form>
</section>
<div id="app" hidden>
  <header class="top">
    <a class="brand" href="../../"><img src="../../assets/ummatee-logo.png" alt="" width="60" height="36"><span>UM+ <b>หลังบ้าน</b></span></a>
    <nav class="tabs" aria-label="เมนูหลังบ้าน"><a href="../dashboard/">แดชบอร์ด</a><a href="../../admin.html">จัดการเคส</a><a href="../teams/" aria-current="page">จัดทีม</a><a href="../stock/">สต็อก</a><a href="../covered/">พื้นที่มอบแล้ว</a></nav>
    <div class="top-r"><span class="sync" id="sync"></span><button class="btn ghost sm" id="refresh">⟳ โหลดใหม่</button><button class="btn ghost sm" id="logout">ออกจากระบบ</button></div>
  </header>
  <main class="wrap" id="main">
    <section class="stats" id="stats" aria-label="สรุปทีม"></section>
    <div class="cols">
      <section class="panel">
        <div class="panel-h"><h2>ทีมอาสา</h2><button class="btn primary sm" id="add-team">+ เพิ่มทีม</button></div>
        <div class="seg" role="tablist" id="team-filter"><button data-f="all" aria-selected="true">ทั้งหมด</button><button data-f="ready" aria-selected="false">พร้อม</button><button data-f="out" aria-selected="false">ออกงาน</button><button data-f="rest" aria-selected="false">พัก</button></div>
        <div id="team-list" class="team-list"></div>
      </section>
      <section class="panel">
        <div class="panel-h"><h2>เคสรอจัดทีม</h2><span class="muted" id="q-count"></span></div>
        <p class="muted small">เรียงจากวิกฤตก่อน · ระบบแนะนำทีมที่พร้อม มีพาหนะตรงกับความต้องการ และอยู่ใกล้ (ถ้าทีมแชร์ตำแหน่ง)</p>
        <div id="queue" class="queue"></div>
      </section>
    </div>

  </main>
</div>
<div class="drawer-bg" id="drawer-bg" hidden></div>
<aside class="drawer" id="drawer" hidden></aside>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="../common.js?v=2"></script>
<script src="../verify.js?v=2"></script>
<script src="../covered.js?v=9"></script>
<script src="./teams.js?v=4"></script>
</body>
</html>
